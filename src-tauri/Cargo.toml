[package]
name = "ffmuxify"
version = "1.0.0"
description = "FFmuxify video encoding and muxing studio"
authors = ["FFmuxify contributors"]
edition = "2021"

[lib]
name = "ffmuxify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.4", features = ["tray-icon"] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
tauri-plugin-clipboard-manager = "2.3.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Graphics_DirectWrite", "Win32_Globalization"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
